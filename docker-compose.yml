name: easytax

services:
  easytax-app:
    container_name: easytax-app
    image: easytax-app:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3004"
      DATABASE_URI: postgresql://${POSTGRES_USER:-easytax}:${POSTGRES_PASSWORD:-6JzPsio6gg4_SaoKb2LRHHzfwT0h4vay}@easytax-postgres:5432/${POSTGRES_DB:-easytax}
      DATABASE_URL: postgresql://${POSTGRES_USER:-easytax}:${POSTGRES_PASSWORD:-6JzPsio6gg4_SaoKb2LRHHzfwT0h4vay}@easytax-postgres:5432/${POSTGRES_DB:-easytax}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:-08aec3986299f95e3e6bc9848914f2085daaf3f34472c24dc2240b9c9b19e39e}
      PAYLOAD_PUBLIC_SERVER_URL: ${PAYLOAD_PUBLIC_SERVER_URL:-https://easytax-157-10-252-77.sslip.io}
      PAYLOAD_CACHE_COMPONENTS_ENABLED: "true"
      RAG_ARTIKEL_ENABLED: "false"
      RUN_MIGRATIONS: "false"
    depends_on:
      easytax-postgres:
        condition: service_healthy
    volumes:
      - /etc/dokploy/compose/easytax-app-hamec4/data/media:/app/media
    networks:
      - dokploy-network
      - default

  easytax-postgres:
    container_name: easytax-postgres
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-easytax}
      POSTGRES_USER: ${POSTGRES_USER:-easytax}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-6JzPsio6gg4_SaoKb2LRHHzfwT0h4vay}
    volumes:
      - /etc/dokploy/compose/easytax-app-hamec4/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-easytax} -d ${POSTGRES_DB:-easytax}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - default

networks:
  dokploy-network:
    external: true
